<!DOCTYPE html>
<html lang="vi" style="background:#050507;color-scheme:dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Bottlegram - Quản lý bot Telegram dễ dàng"
    />
    <title>Bottlegram</title>

    <meta name="theme-color" content="#050507" />
    <script>
      // Apply the persisted theme before React/CSS bootstraps so the browser
      // never paints its default white canvas between navigation and app mount.
      (() => {
        let theme = "system";
        try {
          const persisted = JSON.parse(localStorage.getItem("telegram-bot-store") || "{}");
          theme = persisted?.state?.theme || "system";
        } catch {}
        const dark =
          theme === "dark" ||
          (theme === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
        document.documentElement.style.backgroundColor = dark ? "#050507" : "#f7f7f9";
        document.documentElement.style.colorScheme = dark ? "dark" : "light";
      })();
    </script>
    <style>
      html, body, #root {
        margin: 0;
        width: 100%;
        min-width: 100%;
        height: 100%;
        min-height: 100%;
      }
      html, html body, html #root { background: #050507; }
      html[data-theme="light"],
      html[data-theme="light"] body,
      html[data-theme="light"] #root { background: #f7f7f9; }
    </style>
    <link
      rel="icon"
      type="image/svg+xml"
      href="/favicon.svg"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="main.tsx"></script>
  </body>
</html>
